# Shared, non-secret configuration common to every service. Per-service values
# (SERVICE_NAME, PORT, DB_NAME, gRPC targets, limits) are set inline on each
# Deployment. Secrets (JWT secret, DB credentials) live in Secret objects and
# are created OUT OF GIT (see k8s/README-secrets.md), never committed.
#
# Database topology: ONE RDS PostgreSQL instance hosting six logical databases
# (catalog, users, orders, carts, wishlists, reviews), each owned by its own
# least-privilege role. Every service therefore shares DB_HOST/DB_PORT and
# differs only in DB_NAME (set per Deployment) and its DB_USER/DB_PASSWORD.
apiVersion: v1
kind: ConfigMap
metadata:
  name: bookstore-common
  namespace: bookstore
data:
  NODE_ENV: "production"
  API_BASE_PATH: "/api"
  # Origin(s) allowed by CORS: the Cloudflare Pages frontend. Comma-separated
  # if several. Auth uses Bearer tokens (not cookies), so a specific origin is
  # all that's needed; "*" is avoided for good practice.
  CORS_ORIGINS: "https://bookstore-eafit.pages.dev"
  HTTP_TRUST_PROXY_HOPS: "1"
  HTTP_JSON_BODY_LIMIT: "32kb"

  ACCESS_LOG_ENABLED: "true"
  ACCESS_LOG_EXCLUDE_PATHS: "/health"
  ACCESS_LOG_MAX_FIELD_LENGTH: "2048"
  ACCESS_LOG_REQUEST_ID_HEADER: "X-Request-Id"
  # Clickstream goes to stdout; the Fluent Bit DaemonSet tails the pod logs.
  CLICKSTREAM_FILE_ENABLED: "false"
  CLICKSTREAM_FILE_PATH: "/usr/src/app/logs/clickstream.log"

  # Shared RDS endpoint (same instance for all six databases).
  DB_HOST: "bookstore-postgres.cr4ikmasytby.us-east-1.rds.amazonaws.com"
  DB_PORT: "5432"
  DB_SSL: "true"
  DB_SSL_REJECT_UNAUTHORIZED: "false"
  DB_POOL_MAX: "10"
  DB_IDLE_TIMEOUT_MS: "30000"
  DB_CONNECTION_TIMEOUT_MS: "5000"

  GRPC_HOST: "0.0.0.0"

  # Shared auth identity (non-secret parts).
  AUTH_JWT_ALGORITHM: "HS256"
  AUTH_JWT_ISSUER: "bookstore-api"
  AUTH_JWT_AUDIENCE: "bookstore-web"
  AUTH_TOKEN_TTL_SECONDS: "28800"
  AUTH_COOKIE_NAME: "bookstore_session"
  # Set to "false" while the ALB is plain HTTP; "true" once HTTPS is terminated.
  AUTH_COOKIE_SECURE: "false"
  AUTH_COOKIE_SAME_SITE: "lax"
  AUTH_COOKIE_PATH: "/api"
