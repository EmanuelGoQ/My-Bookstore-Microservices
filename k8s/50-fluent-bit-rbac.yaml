# Fluent Bit runs as a DaemonSet in the logging namespace, reads every node's
# container logs, and ships the bookstore clickstream to S3.
apiVersion: v1
kind: Namespace
metadata:
  name: logging
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: fluent-bit
  namespace: logging
  annotations:
    # IRSA: bind an IAM role that allows s3:PutObject on the target bucket.
    # Create it with eksctl/IAM and paste the role ARN here.
    eks.amazonaws.com/role-arn: arn:aws:iam::ACCOUNT_ID:role/bookstore-fluent-bit-s3
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: fluent-bit-read
rules:
  - apiGroups: [""]
    resources: ["namespaces", "pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: fluent-bit-read
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: fluent-bit-read
subjects:
  - kind: ServiceAccount
    name: fluent-bit
    namespace: logging
