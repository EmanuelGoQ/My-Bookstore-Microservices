# Fluent Bit runs as a DaemonSet in the logging namespace, reads every node's
# container logs, and ships the bookstore clickstream to S3.
#
# AWS Academy note: OIDC/IRSA is unavailable, so Fluent Bit uses the default AWS
# credential chain, which on EKS resolves to the NODE instance role (LabRole).
# No IRSA annotation on the ServiceAccount.
apiVersion: v1
kind: Namespace
metadata:
  name: logging
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: fluent-bit
  namespace: logging
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: fluent-bit-read
rules:
  - apiGroups: [""]
    resources: ["namespaces", "pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: fluent-bit-read
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: fluent-bit-read
subjects:
  - kind: ServiceAccount
    name: fluent-bit
    namespace: logging
