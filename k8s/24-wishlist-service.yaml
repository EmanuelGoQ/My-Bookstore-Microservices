apiVersion: apps/v1
kind: Deployment
metadata:
  name: wishlist-service
  namespace: bookstore
  labels: { app: wishlist-service }
spec:
  replicas: 2
  selector:
    matchLabels: { app: wishlist-service }
  template:
    metadata:
      labels: { app: wishlist-service }
    spec:
      containers:
        - name: wishlist-service
          image: 905418379975.dkr.ecr.us-east-1.amazonaws.com/bookstore/wishlist-service:3dd6e9a
          ports:
            - { name: http, containerPort: 5005 }
          envFrom:
            - configMapRef: { name: bookstore-common }
          env:
            - { name: SERVICE_NAME, value: "wishlist-service" }
            - { name: PORT, value: "5005" }
            - { name: CATALOG_GRPC_TARGET, value: "catalog-grpc:50051" }
            # DB_HOST and DB_PORT come from the shared ConfigMap (envFrom).
            - { name: DB_NAME, value: "wishlists" }
            - { name: DB_USER, valueFrom: { secretKeyRef: { name: bookstore-db, key: WISHLISTS_DB_USER } } }
            - { name: DB_PASSWORD, valueFrom: { secretKeyRef: { name: bookstore-db, key: WISHLISTS_DB_PASSWORD } } }
            - { name: AUTH_JWT_SECRET, valueFrom: { secretKeyRef: { name: bookstore-auth, key: AUTH_JWT_SECRET } } }
          readinessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            requests: { cpu: "50m", memory: "128Mi" }
            limits: { cpu: "500m", memory: "256Mi" }
---
apiVersion: v1
kind: Service
metadata:
  name: wishlist-service
  namespace: bookstore
  labels: { app: wishlist-service }
spec:
  selector: { app: wishlist-service }
  ports:
    - { name: http, port: 80, targetPort: http }
