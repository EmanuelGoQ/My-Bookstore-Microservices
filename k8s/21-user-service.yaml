apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-service
  namespace: bookstore
  labels: { app: user-service }
spec:
  replicas: 2
  selector:
    matchLabels: { app: user-service }
  template:
    metadata:
      labels: { app: user-service }
    spec:
      containers:
        - name: user-service
          image: REGISTRY/user-service:latest
          ports:
            - { name: http, containerPort: 5002 }
            - { name: grpc, containerPort: 50052 }
          envFrom:
            - configMapRef: { name: bookstore-common }
          env:
            - { name: SERVICE_NAME, value: "user-service" }
            - { name: PORT, value: "5002" }
            - { name: GRPC_PORT, value: "50052" }
            - { name: DB_PORT, value: "5432" }
            - { name: DB_NAME, value: "users" }
            - { name: DB_HOST, valueFrom: { secretKeyRef: { name: bookstore-db, key: USERS_DB_HOST } } }
            - { name: DB_USER, valueFrom: { secretKeyRef: { name: bookstore-db, key: USERS_DB_USER } } }
            - { name: DB_PASSWORD, valueFrom: { secretKeyRef: { name: bookstore-db, key: USERS_DB_PASSWORD } } }
            - { name: AUTH_JWT_SECRET, valueFrom: { secretKeyRef: { name: bookstore-auth, key: AUTH_JWT_SECRET } } }
          readinessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            requests: { cpu: "50m", memory: "128Mi" }
            limits: { cpu: "500m", memory: "256Mi" }
---
apiVersion: v1
kind: Service
metadata:
  name: user-service
  namespace: bookstore
  labels: { app: user-service }
spec:
  selector: { app: user-service }
  ports:
    - { name: http, port: 80, targetPort: http }
---
apiVersion: v1
kind: Service
metadata:
  name: user-grpc
  namespace: bookstore
  labels: { app: user-service }
spec:
  selector: { app: user-service }
  ports:
    - { name: grpc, port: 50052, targetPort: grpc }
