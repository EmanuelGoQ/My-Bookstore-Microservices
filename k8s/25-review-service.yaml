apiVersion: apps/v1
kind: Deployment
metadata:
  name: review-service
  namespace: bookstore
  labels: { app: review-service }
spec:
  replicas: 2
  selector:
    matchLabels: { app: review-service }
  template:
    metadata:
      labels: { app: review-service }
    spec:
      containers:
        - name: review-service
          image: REGISTRY/review-service:latest
          ports:
            - { name: http, containerPort: 5006 }
          envFrom:
            - configMapRef: { name: bookstore-common }
          env:
            - { name: SERVICE_NAME, value: "review-service" }
            - { name: PORT, value: "5006" }
            - { name: REVIEWS_MAX_BODY_LENGTH, value: "4000" }
            - { name: REVIEWS_DEFAULT_LIMIT, value: "20" }
            - { name: REVIEWS_MAX_LIMIT, value: "100" }
            - { name: CATALOG_GRPC_TARGET, value: "catalog-grpc:50051" }
            - { name: USER_GRPC_TARGET, value: "user-grpc:50052" }
            - { name: DB_PORT, value: "5432" }
            - { name: DB_NAME, value: "reviews" }
            - { name: DB_HOST, valueFrom: { secretKeyRef: { name: bookstore-db, key: REVIEWS_DB_HOST } } }
            - { name: DB_USER, valueFrom: { secretKeyRef: { name: bookstore-db, key: REVIEWS_DB_USER } } }
            - { name: DB_PASSWORD, valueFrom: { secretKeyRef: { name: bookstore-db, key: REVIEWS_DB_PASSWORD } } }
            - { name: AUTH_JWT_SECRET, valueFrom: { secretKeyRef: { name: bookstore-auth, key: AUTH_JWT_SECRET } } }
          readinessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            requests: { cpu: "50m", memory: "128Mi" }
            limits: { cpu: "500m", memory: "256Mi" }
---
apiVersion: v1
kind: Service
metadata:
  name: review-service
  namespace: bookstore
  labels: { app: review-service }
spec:
  selector: { app: review-service }
  ports:
    - { name: http, port: 80, targetPort: http }
