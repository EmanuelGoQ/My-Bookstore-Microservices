apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: fluent-bit
  namespace: logging
  labels: { app: fluent-bit }
spec:
  selector:
    matchLabels: { app: fluent-bit }
  template:
    metadata:
      labels: { app: fluent-bit }
    spec:
      serviceAccountName: fluent-bit
      tolerations:
        # Run on every node, including control-plane/tainted nodes if present.
        - operator: Exists
      containers:
        - name: fluent-bit
          image: cr.fluentbit.io/fluent/fluent-bit:3.1
          env:
            - { name: AWS_REGION, value: "us-east-1" }
            # Globally-unique bucket: bookstore-clickstream-<ACCOUNT_ID>.
            - { name: CLICKSTREAM_S3_BUCKET, value: "bookstore-clickstream-905418379975" }
          ports:
            - { name: http, containerPort: 2020 }
          resources:
            requests: { cpu: "50m", memory: "64Mi" }
            limits: { cpu: "200m", memory: "128Mi" }
          volumeMounts:
            - { name: config, mountPath: /fluent-bit/etc/ }
            # Node log sources (read-only).
            - { name: varlog, mountPath: /var/log, readOnly: true }
            - { name: varlibdockercontainers, mountPath: /var/lib/docker/containers, readOnly: true }
            # Writable buffer for the S3 output's store_dir.
            - { name: s3buffer, mountPath: /var/fluent-bit/s3 }
      volumes:
        - name: config
          configMap: { name: fluent-bit-config }
        - name: varlog
          hostPath: { path: /var/log }
        - name: varlibdockercontainers
          hostPath: { path: /var/lib/docker/containers }
        - name: s3buffer
          emptyDir: {}
